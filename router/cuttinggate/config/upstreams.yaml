peers:
  pollinations-free:
    proxy: https://gen.pollinations.ai
    models:
    - gpt-oss
    - kimi-k3
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 60
      tlsHandshake: 10
      idleConn: 90
  hf-free:
    proxy: https://router.huggingface.co
    apiKey: ${env.HF_TOKEN}
    models:
    - moonshotai/Kimi-K3
  openrouter-ling:
    proxy: http://127.0.0.1:25109/openrouter-free
    models:
    - inclusionai/ling-3.0-flash-sante:free
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 120
      tlsHandshake: 10
      idleConn: 90
    health:
      enabled: true
      ewma_alpha: 0.2
      failure_threshold: 8
      recovery_credit: 1
      success_threshold: 1
      cool_off_seconds: 30
      degraded_latency_ms: 15000
      degraded_error_rate: 0.5
      weights:
        transport: 2.0
        5xx: 1.5
        404-dead-id: 3.0
        402-not-entitled: 2.0
        403-refused: 1.5
        429-throttled: 0.5
        200-empty: 1.5
